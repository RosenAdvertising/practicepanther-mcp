[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "practicepanther-mcp"
version = "0.1.0"
description = "MCP server for PracticePanther: matters, accounts, tasks, time and billing."
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = ["mcp>=2.3,<3", "requests>=2.34.2", "python-dotenv>=1.2.2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
practicepanther-mcp = "practicepanther_mcp.server:main"
practicepanther-mcp-setup = "practicepanther_mcp.setup.setup:main"
practicepanther-mcp-verify = "practicepanther_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/practicepanther-mcp"
Repository = "https://github.com/RosenAdvertising/practicepanther-mcp"
Issues = "https://github.com/RosenAdvertising/practicepanther-mcp/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
