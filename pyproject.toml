[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "practicepanther-mcp"
version = "0.1.0"
description = "MCP server for PracticePanther — law practice management: matters, contacts, tasks, calendar, time & billing"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0", "requests>=2.31.0", "python-dotenv>=1.0.0"]

[project.scripts]
practicepanther-mcp = "practicepanther_mcp.server:main"
practicepanther-mcp-setup = "practicepanther_mcp.setup.setup:main"
practicepanther-mcp-verify = "practicepanther_mcp.setup.verify:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
